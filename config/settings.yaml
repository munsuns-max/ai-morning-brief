# 무료 API 사용량 가드레일 (하드 리밋이 아니라 '소프트 캡' — 초과 시 경고 로그를 남기고
# 다음 폴백 단계로 넘어갑니다. 하루 1회 실행 기준으로는 절대 도달하지 않아야 정상입니다.)
usage_limits:
  gemini_daily_soft_cap: 20
  groq_daily_soft_cap: 20
