# 파이프라인 동작 설정
pipeline:
  lookback_hours: 30          # 이 시간 이내에 게시된 기사만 후보로 고려
  dedupe_similarity_threshold: 78   # 제목 유사도(0~100). 이 값 이상이면 같은 사건으로 간주해 병합
  max_candidates_for_llm: 15  # 중요도 상위 몇 개까지 LLM에게 넘길지 (비용/한도 보호용 캡)
  max_items_in_brief: 8       # 최종 브리핑에 담을 최대 기사 수
  telegram_max_chars: 3900    # 텔레그램 1건 메시지 최대 길이 (4096 제한보다 여유있게)

# 중요도 스코어링용 키워드 가중치
